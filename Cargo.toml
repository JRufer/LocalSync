[workspace]
resolver = "2"
members = [
    "crates/sync-core",
    "crates/share-smb",
    "crates/share-ui",
    "crates/drive-syncd",
    "crates/drivectl",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["JRufer"]
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4.5", features = ["derive", "env"] }
rusqlite = { version = "0.33", features = ["bundled", "chrono"] }
blake3 = "1.5"
md-5 = "0.10"
hex = "0.4"
notify = "8.0"
ratatui = "0.29"
crossterm = "0.28"
tui-tree-widget = "0.23"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.12", features = ["v4"] }
url = "2.5"
rand = "0.8"
tempfile = "3.15"
futures-util = "0.3"
sync-core = { path = "crates/sync-core" }
share-smb = { path = "crates/share-smb" }
share-ui = { path = "crates/share-ui" }
